name: Sync npm package to GitHub

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version to mirror, or latest
        required: true
        default: latest
        type: string
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: github-package-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'funsaized/pinata'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@funsaized"
          package-manager-cache: false
      - name: Test mirror behavior without registry access
        run: node --test test/github-package.test.mjs
      - name: Mirror and verify published contents
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_VERSION: ${{ inputs.version || 'latest' }}
        run: node scripts/sync-github-package.mjs "$MIRROR_VERSION"
