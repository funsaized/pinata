name: Tests and Pi compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Download Pi's release binary
        # The engine runs inside Pi's Bun binary, as users run it.
        shell: bash
        run: echo "PINATA_PI=$(node scripts/pi-binary.mjs 1.1.0 "$RUNNER_TEMP/pi-binary" | tail -n 1)" >> "$GITHUB_ENV"
      - name: Engine inside Pi (faux provider)
        run: node test/engine/pi-smoke.ts
      - name: Packed package inside Pi
        run: node test/engine/package-smoke.ts
      - name: Engine benchmarks against budgets
        run: npm run bench -- --ci --host pi
      - name: Process backend benchmarks (Gate 2)
        env:
          BENCH_BACKEND: process
        run: npm run bench -- --provider loopback --scenario fanout-1 --scenario fanout-8 --scenario chain --scenario builder
      - name: UX benchmark in interactive Pi (pseudo-terminal)
        # `script` provides the terminal; Windows has no equivalent without extra tools.
        if: runner.os != 'Windows'
        run: npm run bench -- --ci --host tui --scenario ux-8
      - name: Viewer runtimes (E5.6)
        if: runner.os != 'Windows'
        run: node bench/viewer.ts --runs 3

  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run arena:setup
      - run: npm run test:arena
        env:
          ARENA_DOCKER_TEST: "1"
      - run: npm run test:arena:browser -- --dir examples/arena/example-run --chrome google-chrome
      - name: Build pinned real CLI adapters (no model calls)
        run: node examples/arena/adapters/build.mjs --out /tmp/arena-adapter-image.json
      - name: Real CLI session and provider ledger conformance
        run: node examples/arena/adapters/mock-run.mjs --image-file /tmp/arena-adapter-image.json --out /tmp/arena-real-cli-smoke
      - name: Real CLI mock viewer disclosure and replay
        run: npm run test:arena:browser -- --dir /tmp/arena-real-cli-smoke --chrome google-chrome
