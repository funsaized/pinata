name: Tests and Pi compatibility

on:
  push:
    branches: [master, engine]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Install supported Pi
        run: npm install --global @earendil-works/pi-coding-agent@1.1.0
      - name: Locate Pi's CLI
        shell: bash
        run: echo "PINATA_PI=$(npm root -g)/@earendil-works/pi-coding-agent/dist/bundle/cli.js" >> "$GITHUB_ENV"
      - name: Engine inside Pi (faux provider)
        run: node test/engine/pi-smoke.ts
      - name: Engine benchmarks against budgets
        run: npm run bench -- --ci --host pi
      - name: Check 0.7.0 against loopback providers
        # 0.7.0 needs POSIX process control and Herdr; it does not support Windows.
        if: runner.os != 'Windows'
        run: npm run test:pi
