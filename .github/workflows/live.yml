name: Live OpenAI integration

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-openai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-openai:
    name: Live OpenAI (${{ matrix.os }})
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.19.0"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Exercise live tool use, typed reports, continuation and cleanup
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINATA_LIVE_OUTPUT: ${{ runner.temp }}/pinata-live-openai
        run: node test/engine/live-openai-smoke.ts
      - name: Retain live results and every failed run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-openai-${{ github.sha }}-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pinata-live-openai/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
