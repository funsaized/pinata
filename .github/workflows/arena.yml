name: Coding arena offline pilot

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Exercise scripted controls, without model calls
        run: npm run arena -- --offline --trials 2 --out arena/results
      - name: Retain every trial and the summary, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arena-${{ github.sha }}-${{ runner.os }}-node24-${{ github.run_id }}-${{ github.run_attempt }}
          path: arena/results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
