StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Pinata
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = Vale, Pinata
# Explicit selection avoids introducing new rules during package updates.
Google.Headings = suggestion
Google.HeadingPunctuation = suggestion
Google.WordList = suggestion
Google.FirstPerson = suggestion
Google.GenderBias = suggestion
Google.Latin = suggestion
Google.Spacing = warning
ai-tells.AICompoundPhrases = suggestion
ai-tells.AIAdjectiveNounPairs = suggestion
ai-tells.SycophancyMarkers = suggestion
ai-tells.ClosingPleasantries = suggestion
ai-tells.SelfReference = suggestion
Vale.Spelling = warning
Vale.Repetition = warning

# Operational instructions retain mechanics and terminology only.
[{AGENTS.md,STYLE.md,agents/**,prompts/**,skills/**,examples/agents/**}]
BasedOnStyles = Vale, Pinata
Google.Headings = NO
Google.HeadingPunctuation = NO
Google.WordList = NO
Google.FirstPerson = NO
Google.GenderBias = NO
Google.Latin = NO
Google.Spacing = NO
ai-tells.AICompoundPhrases = NO
ai-tells.AIAdjectiveNounPairs = NO
ai-tells.SycophancyMarkers = NO
ai-tells.ClosingPleasantries = NO
ai-tells.SelfReference = NO
